<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahrim Properties | Luxury Real Estate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Navbar -->
    <header class="main-header">
        <div class="logo">
            <i class="fa-solid fa-city"></i>
            <span>Mahrim Properties</span>
        </div>
        <div class="auth-buttons">
            <button onclick="openUserModal('login')" class="btn-secondary"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            <button onclick="openUserModal('signup')" class="btn-primary"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
        </div>
    </header>

    <!-- Hero Banner Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1>আপনার স্বপ্নের আবাসন খুঁজুন সহজেই</h1>
            <p>বিলাসবহুল ফ্লাট বুকিং, কেনাবেচা ও হোটেল রুমের সেরা ডিজিটাল প্ল্যাটফর্ম</p>
            
            <!-- Modern Search Bar -->
            <div class="search-box">
                <div class="input-group">
                    <i class="fa-solid fa-list-check"></i>
                    <select id="filterCategory" onchange="filterProperties()">
                        <option value="all">সব ক্যাটাগরি</option>
                        <option value="rent">Flat Rent</option>
                        <option value="sell">Flat Sell</option>
                        <option value="hotel">Hotel Room</option>
                    </select>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="filterLocation" oninput="filterProperties()" placeholder="লোকেশন (যেমন: মিরপুর, উত্তরা)">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-bangladeshi-taka-sign"></i>
                    <input type="number" id="filterPrice" oninput="filterProperties()" placeholder="সর্বোচ্চ বাজেট">
                </div>
            </div>
        </div>
    </section>

    <!-- Property Section Container -->
    <section class="container">
        <div class="section-title">
            <h2>সর্বশেষ যুক্ত হওয়া প্রোপার্টি সমূহ</h2>
            <p>আপনার পছন্দের ফ্লাট বা রুম বেছে নিন এবং সরাসরি চ্যাট করুন</p>
        </div>
        
        <!-- Grid for Property Cards -->
        <main class="property-grid" id="propertyList"></main>
    </section>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
