<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahrim Properties | Luxury Real Estate</title>
    <!-- CSS Link: Keep exactly 'style.css' -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <i class="fa-solid fa-building-circle-check"></i>
            <span>Mahrim Properties</span>
        </div>
        <div id="authNavContainer">
            <div id="guestNav">
                <button onclick="openUserModal('login')" class="btn-glow-secondary"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
                <button onclick="openUserModal('signup')" class="btn-glow-primary"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
            </div>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="gradient-text">Find Your Luxury Sanctuary</h1>
            <p>Explore exclusive flats, modern apartments, and premium hotel suites.</p>
            
            <div class="glass-search-box">
                <div class="input-group">
                    <i class="fa-solid fa-layer-group"></i>
                    <select id="filterCategory" onchange="filterProperties()">
                        <option value="all">All Categories</option>
                        <option value="rent">Flat Rent</option>
                        <option value="sell">Flat Sell</option>
                        <option value="hotel">Hotel Room</option>
                    </select>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="filterLocation" oninput="filterProperties()" placeholder="Location (e.g. Uttara)">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-tag"></i>
                    <input type="number" id="filterPrice" oninput="filterProperties()" placeholder="Max Budget (BDT)">
                </div>
            </div>
        </div>
    </section>

    <main class="main-container">
        <div class="section-header">
            <h2>Featured Real Estate</h2>
            <div class="glow-line"></div>
        </div>
        <div class="property-grid" id="propertyList"></div>
    </main>

    <div id="userAuthModal" class="modal-overlay" style="display: none;">
        <div class="glass-modal" id="userLoginBox">
            <div class="modal-top">
                <h2>User Login</h2>
                <span onclick="closeUserModal()" class="close-btn">&times;</span>
            </div>
            <form onsubmit="handleEmailLogin(event)">
                <div class="field-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email Address" required>
                </div>
                <div class="field-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-glow-primary full-width">Sign In</button>
            </form>
            <p class="modal-footer-text">New to Mahrim? <a href="#" onclick="switchModal('signup')">Create Account</a></p>
        </div>

        <div class="glass-modal" id="userSignupBox" style="display: none;">
            <div class="modal-top">
                <h2>Create Account</h2>
                <span onclick="closeUserModal()" class="close-btn">&times;</span>
            </div>
            <form onsubmit="handleEmailSignup(event)">
                <div class="field-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="signupName" placeholder="Full Name" required>
                </div>
                <div class="field-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="signupEmail" placeholder="Email Address" required>
                </div>
                <div class="field-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signupPass" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-glow-primary full-width">Register</button>
            </form>
            <p class="modal-footer-text">Already have an account? <a href="#" onclick="switchModal('login')">Sign In</a></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
