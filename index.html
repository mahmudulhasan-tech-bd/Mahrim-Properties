<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahrim Properties | Modern Real Estate</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Professional Navbar -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-building-circle-check"></i>
            <span>Mahrim Properties</span>
        </div>
        <div class="nav-auth">
            <button onclick="openUserModal('login')" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            <button onclick="openUserModal('signup')" class="btn-signup"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
        </div>
    </header>

    <!-- Clean Hero Section -->
    <section class="hero">
        <div class="hero-container">
            <h1>Find Your Dream Sanctuary</h1>
            <p>Explore luxury flats, modern apartments, and premium hotel suites easily.</p>
            
            <!-- Filter Bar -->
            <div class="search-bar">
                <div class="search-item">
                    <i class="fa-solid fa-layer-group"></i>
                    <select id="filterCategory" onchange="filterProperties()">
                        <option value="all">All Categories</option>
                        <option value="rent">Flat Rent</option>
                        <option value="sell">Flat Sell</option>
                        <option value="hotel">Hotel Room</option>
                    </select>
                </div>
                <div class="search-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="filterLocation" oninput="filterProperties()" placeholder="Location (e.g. Uttara)">
                </div>
                <div class="search-item">
                    <i class="fa-solid fa-tag"></i>
                    <input type="number" id="filterPrice" oninput="filterProperties()" placeholder="Max Budget (BDT)">
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="content-container">
        <h2 class="section-heading">Featured Properties</h2>
        <div class="property-grid" id="propertyList"></div>
    </main>

    <!-- Simple Login / Signup Modal -->
    <div id="userAuthModal" class="modal-backdrop" style="display: none;">
        <div class="modal-card" id="userLoginBox">
            <div class="modal-header">
                <h3>User Login</h3>
                <span onclick="closeUserModal()" class="close-icon">&times;</span>
            </div>
            <form onsubmit="handleEmailLogin(event)">
                <input type="email" id="loginEmail" placeholder="Email Address" class="input-field" required>
                <input type="password" id="loginPass" placeholder="Password" class="input-field" required>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>
            <button onclick="handleGoogleLogin()" class="btn-google"><i class="fa-brands fa-google"></i> Continue with Google</button>
            <p class="switch-link">Don't have an account? <a href="#" onclick="switchModal('signup')">Sign Up</a></p>
        </div>

        <div class="modal-card" id="userSignupBox" style="display: none;">
            <div class="modal-header">
                <h3>Create Account</h3>
                <span onclick="closeUserModal()" class="close-icon">&times;</span>
            </div>
            <form onsubmit="handleEmailSignup(event)">
                <input type="text" id="signupName" placeholder="Full Name" class="input-field" required>
                <input type="email" id="signupEmail" placeholder="Email Address" class="input-field" required>
                <input type="password" id="signupPass" placeholder="Password" class="input-field" required>
                <button type="submit" class="btn-submit">Register</button>
            </form>
            <p class="switch-link">Already have an account? <a href="#" onclick="switchModal('login')">Login</a></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
