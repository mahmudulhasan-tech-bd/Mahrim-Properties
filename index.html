<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeHaven | Premium Flat Rent, Sell & Hotel Booking</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-building-user"></i> Prime<span>Haven</span>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#listings">Listings</a></li>
                <li><a href="#features">Services</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="admin.html" class="admin-btn"><i class="fa-solid fa-user-gear"></i> Admin Panel</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Khujun Apnar Shopner Flat Ba Hotel Room</h1>
            <p>Flat Rent, Flat Sell ebong Hotel Booking - Sob Ek Jaygay</p>

            <!-- Search & Filter Bar -->
            <div class="search-box">
                <div class="filter-group">
                    <label><i class="fa-solid fa-list-check"></i> Category</label>
                    <select id="filterCategory">
                        <option value="all">All Categories</option>
                        <option value="rent">Flat Rent</option>
                        <option value="sell">Flat Sell</option>
                        <option value="hotel">Hotel Room</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label><i class="fa-solid fa-location-dot"></i> Location</label>
                    <input type="text" id="filterLocation" placeholder="e.g. Gulshan, Dhaka">
                </div>
                <div class="filter-group">
                    <label><i class="fa-solid fa-bangladeshi-taka-sign"></i> Max Price</label>
                    <input type="number" id="filterPrice" placeholder="Max Budget">
                </div>
                <button onclick="filterProperties()" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </div>
        </div>
    </section>

    <!-- Listings Section -->
    <section id="listings" class="container">
        <h2 class="section-title">Featured Properties & Hotels</h2>
        <div id="propertyList" class="grid-container">
            <!-- Dynamic items loaded via JavaScript -->
        </div>
    </section>

    <!-- Contact & Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Inquire / Book Property</h3>
            <form id="bookingForm" onsubmit="handleBooking(event)">
                <input type="text" id="custName" placeholder="Apnar Naam" required>
                <input type="tel" id="custPhone" placeholder="Mobile Number" required>
                <textarea id="custMsg" placeholder="Apnar Message ba Requirement..." rows="4"></textarea>
                <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Send Request</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 PrimeHaven Platform. All Rights Reserved.</p>
    </footer>

    <!-- Firebase SDK & Custom Script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
