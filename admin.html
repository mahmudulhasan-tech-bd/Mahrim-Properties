<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | PrimeHaven</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <h2><i class="fa-solid fa-sliders"></i> Property & Hotel Management Panel</h2>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Main Website-e Phire Jao</a>

        <!-- Add Property Form -->
        <div class="card form-card">
            <h3>Add New Listing</h3>
            <form id="addPropertyForm" onsubmit="addProperty(event)">
                <div class="form-grid">
                    <div>
                        <label>Title</label>
                        <input type="text" id="pTitle" placeholder="e.g. 3 BHK Luxury Apartment" required>
                    </div>
                    <div>
                        <label>Category</label>
                        <select id="pCategory" required>
                            <option value="rent">Flat Rent</option>
                            <option value="sell">Flat Sell</option>
                            <option value="hotel">Hotel Room</option>
                        </select>
                    </div>
                    <div>
                        <label>Price (BDT)</label>
                        <input type="number" id="pPrice" placeholder="e.g. 25000" required>
                    </div>
                    <div>
                        <label>Location</label>
                        <input type="text" id="pLocation" placeholder="e.g. Dhanmondi, Dhaka" required>
                    </div>
                    <div>
                        <label>Bedrooms / Type</label>
                        <input type="text" id="pBed" placeholder="e.g. 3 Bed / Deluxe Room">
                    </div>
                    <div>
                        <label>Image URL</label>
                        <input type="url" id="pImg" placeholder="https://example.com/image.jpg" required>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <label>Description</label>
                    <textarea id="pDesc" rows="3" placeholder="Full Details..."></textarea>
                </div>
                <button type="submit" class="add-btn"><i class="fa-solid fa-plus"></i> Save Listing</button>
            </form>
        </div>

        <!-- Manage Existing Listings -->
        <div class="card">
            <h3>Manage Existing Properties</h3>
            <div id="adminPropertyList" class="admin-grid">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
