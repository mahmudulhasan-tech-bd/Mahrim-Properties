<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tasnim Properties</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <a href="index.html" class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">
                <span class="brand-name">TASNIM</span>
                <span class="brand-sub">ADMIN</span>
            </div>
        </a>
        <div class="admin-profile">
            <div class="user-avatar">
                <span>Admin User</span>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-menu">
                <span class="menu-label">MENU</span>
                <a href="#" class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="index.html" class="nav-item"><i class="fa-solid fa-globe"></i> Visit Website</a>
            </div>
        </aside>

        <main class="admin-main">
            <div class="page-header">
                <h1>Dashboard Overview</h1>
                <p>Welcome back, manage your properties and listings here.</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-building"></i></div>
                    <div>
                        <small>Total Properties</small>
                        <h2>3</h2>
                    </div>
                </div>
            </div>

            <div class="table-card">
                <div class="table-header">
                    <h3>Recent Listings</h3>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Property Title</th>
                            <th>Location</th>
                            <th>Type</th>
                            <th>Price</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Luxury 3 Bedroom Apartment</td>
                            <td>Uttara Sector 10, Dhaka</td>
                            <td>Apartment</td>
                            <td>৳ 1,25,00,000</td>
                            <td><span class="badge status-approved">Approved</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="admin-app.js"></script>
</body>
</html>
