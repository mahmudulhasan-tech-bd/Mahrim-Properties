<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mahrim Properties</title>
    <!-- CSS Link: Keep exactly 'style.css' -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <i class="fa-solid fa-building-circle-check"></i>
            <span>Mahrim Properties <small style="font-size: 0.8rem; color: #6366f1;">[Admin Panel]</small></span>
        </div>
        <a href="index.html" class="btn-glow-secondary"><i class="fa-solid fa-eye"></i> View Live Site</a>
    </header>

    <main class="main-container">
        <div class="admin-card">
            <div class="section-header">
                <h2>Add New Property Listing</h2>
                <div class="glow-line"></div>
            </div>

            <form id="addPropertyForm" onsubmit="handlePropertySubmit(event)">
                <div class="admin-form-grid">
                    <div class="field-group">
                        <i class="fa-solid fa-heading"></i>
                        <input type="text" id="propTitle" placeholder="Property Title" required>
                    </div>

                    <div class="field-group">
                        <i class="fa-solid fa-layer-group"></i>
                        <select id="propCategory" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="rent">Flat Rent</option>
                            <option value="sell">Flat Sell</option>
                            <option value="hotel">Hotel Room</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="propLocation" placeholder="Location" required>
                    </div>

                    <div class="field-group">
                        <i class="fa-solid fa-tag"></i>
                        <input type="number" id="propPrice" placeholder="Price (BDT)" required>
                    </div>

                    <div class="field-group">
                        <i class="fa-solid fa-image"></i>
                        <input type="url" id="propImage" placeholder="Image URL" required>
                    </div>

                    <div class="field-group">
                        <i class="fa-brands fa-whatsapp"></i>
                        <input type="text" id="propWhatsapp" placeholder="WhatsApp Number" required>
                    </div>
                </div>

                <button type="submit" class="btn-glow-primary full-width" style="margin-top: 15px;">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Publish Property
                </button>
            </form>
        </div>

        <div class="section-header" style="margin-top: 50px;">
            <h2>Manage Live Listings</h2>
            <div class="glow-line"></div>
        </div>

        <div class="property-grid" id="adminPropertyList"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
